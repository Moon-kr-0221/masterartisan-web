<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MASTERARTISAN — 작업 사례</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Serif+KR:wght@200;300;400&display=swap" rel="stylesheet" />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            canvas:'#FAFAF8', surface:'#F0EDE6', surface2:'#ECEAE4',
            ink:'#1A1A1A', ink2:'#1A1714', inksoft:'#3D3A36', body:'#555555',
            muted:'#999999', mutedl:'#AAAAAA', sage:'#A09890',
            hairline:'#E8E8E8', hairline2:'#E2DDD6', gold:'#C8963C', gold2:'#C4A882',
            night:'#0D0C0A', coal:'#111111', forest:'#16261C',
          },
          fontFamily: { serif:['"Noto Serif KR"','serif'], sans:['"Noto Sans KR"','sans-serif'] },
        },
      },
    };
  </script>
  <style>
    html { -webkit-tap-highlight-color: transparent; }
    body { font-family: '"Noto Sans KR"', sans-serif; }
    .scrollbar-hide { -ms-overflow-style:none; scrollbar-width:none; }
    .scrollbar-hide::-webkit-scrollbar { display:none; }
  </style>
</head>

<body class="bg-white text-ink antialiased mx-auto max-w-[430px] overflow-x-hidden">

  <!-- GNB -->
  <header class="sticky top-0 z-40 flex h-14 items-center justify-between border-b border-hairline bg-white px-6">
    <a href="home.html" class="font-sans text-[13px] font-bold tracking-[2px] text-ink">MASTERARTISAN</a>
    <button id="menuOpen" aria-label="메뉴 열기" class="p-1 -mr-1">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1A1A1A" stroke-width="1.5" stroke-linecap="round">
        <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
    </button>
  </header>

  <!-- Fullscreen menu -->
  <nav id="menu" class="fixed inset-0 z-50 translate-y-full overflow-y-auto bg-night text-white transition-transform duration-500 ease-[cubic-bezier(0.22,1,0.36,1)]">
    <div class="flex h-14 items-center justify-between border-b border-white/10 px-6">
      <span class="font-sans text-[13px] font-bold tracking-[2px]">MASTERARTISAN</span>
      <button id="menuClose" aria-label="메뉴 닫기" class="p-1 -mr-1">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round">
          <line x1="5" y1="5" x2="19" y2="19"/><line x1="19" y1="5" x2="5" y2="19"/>
        </svg>
      </button>
    </div>
    <ul class="flex flex-col px-6 py-4">
      <li><a href="home.html"          class="block border-b border-white/10 py-6 font-serif text-3xl font-light text-white/60">HOME <span class="ml-2 align-middle font-sans text-[10px] tracking-[2px] text-gold2">01</span></a></li>
      <li><a href="masterartisan.html" class="block border-b border-white/10 py-6 font-serif text-3xl font-light text-white/60">MASTERARTISAN <span class="ml-2 align-middle font-sans text-[10px] tracking-[2px] text-gold2">02</span></a></li>
      <li><a href="history.html"       class="block border-b border-white/10 py-6 font-serif text-3xl font-light text-white/60">HISTORY <span class="ml-2 align-middle font-sans text-[10px] tracking-[2px] text-gold2">03</span></a></li>
      <li><a href="works.html"         class="block border-b border-white/10 py-6 font-serif text-3xl font-light">WORKS <span class="ml-2 align-middle font-sans text-[10px] tracking-[2px] text-gold2">04</span></a></li>
      <li><a href="contact.html"       class="block py-6 font-serif text-3xl font-light text-white/60">CONTACT <span class="ml-2 align-middle font-sans text-[10px] tracking-[2px] text-gold2">05</span></a></li>
    </ul>
    <p class="px-6 pb-12 pt-4 font-sans text-[11px] leading-relaxed text-white/40">전통건축에 관한 문의나 방문을 환영합니다.<br/>경기무형문화재 제36호.</p>
  </nav>

  <!-- Page hero -->
  <section class="relative h-[300px] overflow-hidden bg-night">
    <img src="https://images.unsplash.com/photo-1761452776106-78710d4fada9?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&q=80&w=1080" alt="" class="absolute inset-0 h-full w-full object-cover" />
    <div class="absolute inset-0" style="background:linear-gradient(to bottom, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.65) 100%)"></div>
    <div data-reveal class="absolute bottom-8 left-6 right-6 translate-y-10 opacity-0 transition-all duration-700 ease-out">
      <p class="font-sans text-[11px] tracking-[4px] text-white/60">OUR WORKS</p>
      <h1 class="mt-2.5 font-serif text-4xl font-light text-white">작업 사례</h1>
      <p class="mt-2.5 font-sans text-[13px] leading-[1.7] text-white/65">전통건축 유지보수·수리·제작에 걸친 대표 작업물을 소개합니다.</p>
    </div>
  </section>

  <!-- Filter row (가로 스크롤) -->
  <div class="scrollbar-hide sticky top-14 z-30 flex gap-2 overflow-x-auto border-b border-hairline bg-white px-6 py-4">
    <button data-cat="all" class="filter-tab shrink-0 bg-ink px-[18px] py-2 font-sans text-[11px] tracking-wide text-white">전체</button>
    <button data-cat="maintenance" class="filter-tab shrink-0 border border-[#D8D5CF] px-[18px] py-2 font-sans text-[11px] tracking-wide text-muted">유지보수</button>
    <button data-cat="repair" class="filter-tab shrink-0 border border-[#D8D5CF] px-[18px] py-2 font-sans text-[11px] tracking-wide text-muted">수리</button>
    <button data-cat="fabrication" class="filter-tab shrink-0 border border-[#D8D5CF] px-[18px] py-2 font-sans text-[11px] tracking-wide text-muted">제작</button>
    <button data-cat="drawing" class="filter-tab shrink-0 border border-[#D8D5CF] px-[18px] py-2 font-sans text-[11px] tracking-wide text-muted">도면</button>
  </div>

  <!-- Works grid (세로 1단) -->
  <section class="bg-white px-6 pb-16 pt-12">
    <div id="worksGrid" class="flex flex-col gap-10"></div>
    <p id="worksEmpty" class="hidden py-24 text-center font-sans text-sm text-mutedl">해당 카테고리의 작업이 없습니다.</p>
    <button id="loadMore" class="mt-10 hidden h-12 w-full items-center justify-center border border-ink/35 font-sans text-xs tracking-[2px] text-ink active:bg-ink active:text-white transition-colors">작업 더 보기</button>
  </section>

  <!-- Lightbox -->
  <div id="lightbox" class="fixed inset-0 z-[60] hidden items-center justify-center bg-black/90 px-6">
    <div class="max-h-[85vh] w-full max-w-[380px] overflow-y-auto bg-white">
      <img id="lbImg" src="" alt="" class="aspect-video w-full object-cover" />
      <div class="p-6">
        <p id="lbMeta" class="font-sans text-[10px] tracking-wide text-mutedl"></p>
        <h3 id="lbTitle" class="mt-2 font-serif text-xl font-light text-ink"></h3>
        <p id="lbDesc" class="mt-3 font-sans text-[13px] leading-[1.9] text-body"></p>
        <button id="lbClose" class="mt-6 font-sans text-[11px] tracking-wide text-mutedl">닫기 ✕</button>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="flex flex-col items-center gap-2 bg-ink px-6 py-10">
    <span class="font-sans text-[13px] font-bold tracking-[2px] text-white">MASTERARTISAN</span>
    <span class="font-sans text-[10px] text-[#555]">© 2024 MasterArtisan. All rights reserved.</span>
  </footer>

  <script>
    const menu = document.getElementById('menu');
    const openMenu  = () => { menu.classList.remove('translate-y-full'); document.body.style.overflow = 'hidden'; };
    const closeMenu = () => { menu.classList.add('translate-y-full');    document.body.style.overflow = ''; };
    document.getElementById('menuOpen').addEventListener('click', openMenu);
    document.getElementById('menuClose').addEventListener('click', closeMenu);
    menu.querySelectorAll('a').forEach(a => a.addEventListener('click', closeMenu));

    // ── Supabase (데스크탑 /works와 동일 데이터) ──
    const SB_URL = 'https://oizjcdtnlbqehbgoyyyr.supabase.co';
    const SB_KEY = 'sb_publishable_zaS1vhs9KDHDeMxkVMCGwg_0sscVBQR';
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    const CAT_LABEL = { maintenance:'유지보수', repair:'수리', fabrication:'제작', drawing:'도면' };
    const PAGE_SIZE = 6;

    // 정적 폴백 (DB 미응답 시) — 데스크탑 data/works.ts와 동일
    const U = (id) => 'https://images.unsplash.com/'+id+'?auto=format&fit=crop&w=1080&q=80';
    const FALLBACK = [
      { title:'수원 사찰 대웅전 보수', category:'maintenance', year:'2022', description:'전통 목구조 대웅전의 지붕 및 기둥 보수 공사.', image_url:U('photo-1759662802641-1748a95ade41') },
      { title:'용인 전통 가옥 수리', category:'repair', year:'2021', description:'조선시대 전통 한옥 기와 및 목구조 전면 수리.', image_url:U('photo-1512059555341-6a121e7d4d86') },
      { title:'전통 문짝 제작', category:'fabrication', year:'2023', description:'전통 소나무 목재를 이용한 사찰 법당 문짝 제작.', image_url:U('photo-1542722578-f2971981d74f') },
      { title:'경기도 향교 기와 보수', category:'maintenance', year:'2022', description:'조선시대 향교 건물 기와 전면 교체 및 보수.', image_url:U('photo-1765570710985-fe9e17af1b6c') },
      { title:'전통 누각 복원', category:'repair', year:'2020', description:'화재로 소실된 전통 누각의 원형 복원 작업.', image_url:U('photo-1584264415558-6580a2bf40a0') },
      { title:'전통 창호 제작', category:'fabrication', year:'2023', description:'전통 한지와 목재를 사용한 격자창호 주문 제작.', image_url:U('photo-1621083377566-7ba9edc11ae6') },
      { title:'남한산성 문루 보수', category:'maintenance', year:'2021', description:'남한산성 내 조선시대 문루 목구조 부재 교체 및 단청 보수.', image_url:U('photo-1565073624497-7144969d4a9d') },
      { title:'전통 소반 제작', category:'fabrication', year:'2022', description:'전통 나주소반 형식의 주문 제작. 느티나무 원목 사용.', image_url:U('photo-1558618666-fcd25c85cd64') },
      { title:'화성 행궁 별당 수리', category:'repair', year:'2023', description:'화성 행궁 부속 별당 지붕 및 대들보 균열 보수 공사.', image_url:U('photo-1519581706030-bf476f0f5eb0') },
    ];

    let ALL = [];
    let active = 'all';
    let visible = PAGE_SIZE;

    const grid = document.getElementById('worksGrid');
    const emptyEl = document.getElementById('worksEmpty');
    const moreBtn = document.getElementById('loadMore');

    function cardHTML(w, i){
      const delay = (i % 3) * 80;
      return '<article data-reveal class="translate-y-10 opacity-0 transition-all duration-700 ease-out cursor-pointer" style="transition-delay:'+delay+'ms">'
        + '<div class="overflow-hidden"><img src="'+esc(w.image_url)+'" alt="'+esc(w.title)+'" class="h-60 w-full object-cover" /></div>'
        + '<p class="mt-5 font-sans text-[10px] tracking-wide text-mutedl">'+esc(CAT_LABEL[w.category]||'')+' · '+esc(w.year)+'</p>'
        + '<h2 class="mt-1.5 font-serif text-lg font-light text-ink">'+esc(w.title)+'</h2>'
        + '</article>';
    }

    function render(){
      const filtered = active==='all' ? ALL : ALL.filter((w)=>w.category===active);
      const shown = filtered.slice(0, visible);
      grid.innerHTML = shown.map((w,i)=>cardHTML(w,i)).join('');
      emptyEl.classList.toggle('hidden', shown.length>0);
      if (visible < filtered.length){ moreBtn.classList.remove('hidden'); moreBtn.classList.add('flex'); }
      else { moreBtn.classList.add('hidden'); moreBtn.classList.remove('flex'); }
      grid.querySelectorAll('article').forEach((el,i)=> el.addEventListener('click', ()=> openLightbox(shown[i])));
      observeReveal();
    }

    // Filter tabs
    const tabs = document.querySelectorAll('.filter-tab');
    tabs.forEach((t) => t.addEventListener('click', () => {
      tabs.forEach((x) => {
        x.classList.remove('bg-ink', 'text-white');
        x.classList.add('border', 'border-[#D8D5CF]', 'text-muted');
      });
      t.classList.remove('border', 'border-[#D8D5CF]', 'text-muted');
      t.classList.add('bg-ink', 'text-white');
      active = t.dataset.cat || 'all';
      visible = PAGE_SIZE;
      render();
    }));

    moreBtn.addEventListener('click', () => { visible += PAGE_SIZE; render(); });

    // Lightbox
    const lb = document.getElementById('lightbox');
    function openLightbox(w){
      if (!w) return;
      document.getElementById('lbImg').src = w.image_url || '';
      document.getElementById('lbMeta').textContent = (CAT_LABEL[w.category]||'') + ' · ' + (w.year||'');
      document.getElementById('lbTitle').textContent = w.title || '';
      document.getElementById('lbDesc').textContent = w.description || '';
      lb.classList.remove('hidden'); lb.classList.add('flex');
      document.body.style.overflow = 'hidden';
    }
    function closeLightbox(){ lb.classList.add('hidden'); lb.classList.remove('flex'); document.body.style.overflow = ''; }
    document.getElementById('lbClose').addEventListener('click', closeLightbox);
    lb.addEventListener('click', (e) => { if (e.target === lb) closeLightbox(); });

    // Scroll reveal (렌더마다 재관찰)
    const io = new IntersectionObserver((entries) => {
      entries.forEach((e) => {
        if (e.isIntersecting) {
          e.target.classList.remove('opacity-0', 'translate-y-10');
          e.target.classList.add('opacity-100', 'translate-y-0');
          io.unobserve(e.target);
        }
      });
    }, { threshold: 0.15, rootMargin: '0px 0px -10% 0px' });
    function observeReveal(){ document.querySelectorAll('[data-reveal]').forEach((el) => io.observe(el)); }

    // Init — DB에서 데스크탑과 동일한 작업 목록 로드 (실패 시 폴백)
    (async function init(){
      try {
        const url = SB_URL + '/rest/v1/ma_works?select=title,category,year,description,image_url&order=sort_order.asc,created_at.asc';
        const r = await fetch(url, { headers:{ apikey:SB_KEY, Authorization:'Bearer '+SB_KEY } });
        if (!r.ok) throw new Error('http '+r.status);
        const rows = await r.json();
        ALL = (Array.isArray(rows) && rows.length) ? rows : FALLBACK;
      } catch(e) { ALL = FALLBACK; }
      render();
    })();
  </script>
</body>
</html>
