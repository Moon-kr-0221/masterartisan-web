<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MASTERARTISAN — 모바일 퍼블리싱 미리보기</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700&family=Noto+Serif+KR:wght@300&display=swap" rel="stylesheet" />
  <style>
    body { font-family: '"Noto Sans KR"', sans-serif; }
    .serif { font-family: '"Noto Serif KR"', serif; }
    iframe { width: 390px; height: 760px; border: 0; }
  </style>
</head>
<body class="bg-[#0D0C0A] text-white">
  <header class="px-8 pt-12 pb-6">
    <p class="text-[11px] tracking-[4px] text-[#C8963C]">MASTERARTISAN · MOBILE WEB</p>
    <h1 class="serif mt-3 text-4xl font-light">모바일 퍼블리싱 미리보기</h1>
    <p class="mt-3 max-w-2xl text-sm leading-relaxed text-white/50">5개 페이지(HTML + Tailwind CSS). 각 프레임은 실제 페이지를 390px로 임베드한 것입니다. 클릭하면 새 탭에서 전체 화면으로 열립니다. 햄버거 메뉴·스크롤 리빌·가로 스와이프 모션은 프레임 안에서 직접 동작합니다.</p>
  </header>
  <main class="flex snap-x snap-mandatory gap-6 overflow-x-auto px-8 pb-16">
    <!-- cards inserted by script -->
  </main>
  <script>
    const pages = [
      ['01', 'HOME', 'home.html', '히어로 · 철학 · 마퀴 · 작업 캐러셀 · 공정'],
      ['02', 'MASTERARTISAN', 'masterartisan.html', '삼대 장인 세로 스택 · 인증'],
      ['03', 'HISTORY', 'history.html', '다이얼 인트로 · 연혁 타임라인 모션 (자코모 ?p=9)'],
      ['04', 'WORKS', 'works.html', '필터 탭 · 작업물 1단 리스트'],
      ['05', 'CONTACT', 'contact.html', '연락처 · 지도 카드'],
    ];
    const main = document.querySelector('main');
    for (const [no, name, href, desc] of pages) {
      const card = document.createElement('div');
      card.className = 'shrink-0 snap-start';
      card.innerHTML = `
        <div class="flex items-center justify-between pb-3">
          <div><span class="text-[10px] tracking-[2px] text-[#C8963C]">${no}</span>
          <a href="${href}" target="_blank" class="serif ml-2 text-xl font-light hover:underline">${name} ↗</a></div>
        </div>
        <p class="pb-3 text-[11px] text-white/40">${desc}</p>
        <div class="overflow-hidden rounded-[2px] ring-1 ring-white/10">
          <iframe src="${href}" loading="lazy" title="${name}"></iframe>
        </div>`;
      main.appendChild(card);
    }
  </script>
</body>
</html>
